services:
  - type: web
    name: clima-rest-neon
    runtime: docker
    plan: free
    dockerfilePath: ClimaREST_RenderNeon/Dockerfile
    dockerContext: ClimaREST_RenderNeon
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        sync: false
